name: Check documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs-check.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs-check.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      - name: Verify handbook is synchronized
        run: git diff --exit-code -- docs/PROJECT_HANDBOOK.md
