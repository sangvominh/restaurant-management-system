name: bigdata-phase1
services:
  namenode:
    image: apache/hadoop:3.4.1
    platform: linux/amd64
    user: root
    hostname: namenode
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ ! -f /data/namenode/current/VERSION ]; then hdfs namenode -format -nonInteractive; fi
        exec hdfs namenode
    environment:
      HADOOP_CONF_DIR: /phase1-conf
    volumes:
      - namenode:/data/namenode
      - ./conf:/phase1-conf:ro
    ports:
      - "127.0.0.1:9870:9870"
  datanode:
    image: apache/hadoop:3.4.1
    platform: linux/amd64
    user: root
    hostname: datanode
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec hdfs datanode"]
    environment:
      HADOOP_CONF_DIR: /phase1-conf
    volumes:
      - datanode:/data/datanode
      - ./conf:/phase1-conf:ro
    depends_on:
      - namenode
  spark-master:
    image: apache/spark:3.5.3
    hostname: spark-master
    volumes:
      - ./scripts:/phase1-scripts:ro
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
  spark-worker:
    image: apache/spark:3.5.3
    hostname: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1g
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      - spark-master
volumes:
  namenode:
  datanode:
