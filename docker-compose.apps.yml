# Bổ sung ứng dụng; file database docker-compose.yml của nhóm giữ nguyên.
services:
  backend-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://restaurant:local_dev_only@db:5432/restaurant_dev?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://restaurant:local_dev_only@db:5432/restaurant_dev?schema=public
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: .
      dockerfile: apps/web-admin-system/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    init: true
